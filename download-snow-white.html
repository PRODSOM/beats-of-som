<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download Snow White</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Playfair Display', serif;
    }

    body{
      height:100vh;
      background:url('download.gif') no-repeat center center/cover;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      text-align:center;
      padding:20px;
    }

    .container{
      background:rgba(0,0,0,0.62);
      padding:45px;
      border-radius:24px;
      backdrop-filter:blur(14px);
      max-width:430px;
      width:100%;
      border:1px solid rgba(255,255,255,0.08);
    }

    .brand{
      font-size:1.35rem;
      margin-bottom:10px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 25px rgba(255,255,255,0.7);
    }

    h1{
      font-size:2.5rem;
      margin-bottom:16px;
      text-shadow:
        0 0 12px rgba(255,255,255,0.9),
        0 0 25px rgba(255,255,255,0.5);
    }

    .sub{
      margin-bottom:25px;
      opacity:0.88;
      line-height:1.7;
      font-size:1rem;
    }

    .btn{
      padding:15px 34px;
      border-radius:35px;
      border:1px solid rgba(255,255,255,0.75);
      background:rgba(255,255,255,0.04);
      color:white;
      cursor:pointer;
      font-size:1rem;
      transition:0.4s;
    }

    .btn:hover{
      transform:scale(1.05);
      box-shadow:0 0 28px rgba(255,255,255,0.8);
    }

    .back{
      display:inline-block;
      margin-top:22px;
      color:white;
      text-decoration:none;
      opacity:0.65;
      transition:0.3s;
      font-size:0.9rem;
    }

    .back:hover{
      opacity:1;
      text-shadow:0 0 12px rgba(255,255,255,0.8);
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="brand">
      Beats Of S.O.M
    </div>

    <h1>Thank You 🕊️</h1>

    <div class="sub">
      The Snow White WAV File is now Yours
    </div>

    <a href="https://drive.google.com/file/d/1XHPOXynp0XkhYu_emc5zmLon3STFq7m5/view?usp=sharing">

      <button class="btn">
        Download WAV
      </button>

    </a>

    <br>

    <a href="https://prodsom.github.io/beats-of-som/" class="back">
      ← Return to Haven
    </a>

  </div>

</body>
</html>
