<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download Inhuman</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      height: 100vh;
      background: url('download.gif') no-repeat center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      font-family: 'Playfair Display', serif;
    }

    .container {
      background: rgba(0,0,0,0.65);
      padding: 45px;
      border-radius: 20px;
      backdrop-filter: blur(14px);
      max-width: 420px;
    }

    .brand {
      font-size: 1.3rem;
      margin-bottom: 10px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 25px rgba(255,255,255,0.7);
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 15px;
    }

    .sub {
      margin-bottom: 25px;
      opacity: 0.85;
    }

    .btn {
      padding: 15px 30px;
      border: 1px solid white;
      background: transparent;
      color: white;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.4s;
    }

    .btn:hover {
      box-shadow: 0 0 25px white;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

<div class="container">

  <div class="brand">Beats Of S.O.M</div>

  <h1>Thank You 🕊️</h1>

  <div class="sub">
    The Inhuman WAV File is now Yours
  </div>

  <a href="https://drive.google.com/file/d/1bgWzYGoFtI6EJDkx8DhdXP7npv1QSluU/view?usp=sharing">
    <button class="btn">Download WAV</button>
  </a>

</div>

</body>
</html>
