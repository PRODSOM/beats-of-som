  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Playfair Display', serif;
    }

    body{
      height:100vh;
      background:url('beat-landing.gif') no-repeat center center/cover;
      display:flex;
      align-items:center;
      justify-content:center;
      color:white;
      text-align:center;
      padding:20px;
    }

    .container{
      background:rgba(0,0,0,0.6);
      padding:45px;
      border-radius:24px;
      backdrop-filter:blur(14px);
      max-width:430px;
      width:100%;
      border:1px solid rgba(255,255,255,0.08);
    }

    .brand{
      font-size:1.35rem;
      margin-bottom:10px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 25px rgba(255,255,255,0.7),
        0 0 45px rgba(255,255,255,0.5);
    }

    h1{
      font-size:2.7rem;
      margin-bottom:15px;
      text-shadow:
        0 0 12px rgba(255,255,255,0.9),
        0 0 30px rgba(255,255,255,0.6);
    }

    .sub{
      font-size:0.97rem;
      line-height:1.7;
      opacity:0.85;
      margin-bottom:22px;
    }

    audio{
      width:100%;
      margin-bottom:24px;
    }

    .btn{
      padding:15px 34px;
      border-radius:35px;
      border:1px solid rgba(255,255,255,0.75);
      background:rgba(255,255,255,0.04);
      color:white;
      cursor:pointer;
      font-size:1rem;
      transition:0.4s;
      animation:pulse 3s infinite;
    }

    .btn:hover{
      transform:scale(1.05);
      box-shadow:0 0 28px rgba(255,255,255,0.8);
    }

    @keyframes pulse{

      0%{
        box-shadow:0 0 5px rgba(255,255,255,0.2);
      }

      50%{
        box-shadow:0 0 20px rgba(255,255,255,0.5);
      }

      100%{
        box-shadow:0 0 5px rgba(255,255,255,0.2);
      }

    }

    .note{
      margin-top:18px;
      font-size:0.85rem;
      opacity:0.72;
      line-height:1.6;
    }

    .back{
      display:inline-block;
      margin-top:22px;
      color:white;
      text-decoration:none;
      opacity:0.65;
      transition:0.3s;
      font-size:0.9rem;
    }

    .back:hover{
      opacity:1;
      text-shadow:0 0 12px rgba(255,255,255,0.8);
    }

  </style>
</head>

    </div>

    <a href="https://prodsom.github.io/beats-of-som/" class="back">
      ← Return to Haven

</html>
