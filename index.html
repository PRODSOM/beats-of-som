<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beats Of S.O.M</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Playfair Display', serif;
    }

    html, body{
      height:100%;
      color:white;
      overflow-x:hidden;
      background:black;
    }

    .landing{
      height:100vh;
      background:url('landing.gif') no-repeat center center/cover;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      padding:20px;
    }

    .landing h1{
      font-size:4rem;
      text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 25px rgba(255,255,255,0.7),
        0 0 50px rgba(255,255,255,0.5);
      letter-spacing:3px;
    }

    .subtitle{
      margin-top:18px;
      font-size:1.15rem;
      opacity:0.9;
      text-shadow:0 0 10px rgba(255,255,255,0.6);
    }

    .enter-btn{
      margin-top:35px;
      padding:15px 45px;
      border-radius:40px;
      border:1px solid rgba(255,255,255,0.7);
      background:rgba(0,0,0,0.35);
      color:white;
      font-size:1rem;
      cursor:pointer;
      transition:0.4s;
      backdrop-filter:blur(8px);
    }

    .enter-btn:hover{
      transform:scale(1.05);
      box-shadow:0 0 25px rgba(255,255,255,0.8);
    }

    .main{
      min-height:100vh;
      background:url('main.gif') no-repeat center center/cover;
      display:none;
      padding:50px 20px 70px;
    }

    .header{
      text-align:center;
      margin-bottom:18px;
      font-size:3.2rem;
      letter-spacing:2px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 25px rgba(255,255,255,0.8),
        0 0 50px rgba(255,255,255,0.5);
      animation:glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow{
      from{
        text-shadow:
          0 0 8px rgba(255,255,255,0.7),
          0 0 20px rgba(255,255,255,0.5);
      }

      to{
        text-shadow:
          0 0 14px rgba(255,255,255,1),
          0 0 35px rgba(255,255,255,0.9),
          0 0 60px rgba(255,255,255,0.6);
      }
    }

    .message{
      text-align:center;
      margin-bottom:50px;
      font-size:1rem;
      opacity:0.92;
      line-height:1.8;
      text-shadow:0 0 10px rgba(255,255,255,0.35);
    }

    .beats{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:35px;
    }

    .beat-card{
      width:310px;
      background:rgba(0,0,0,0.45);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:22px;
      padding:25px;
      text-align:center;
      backdrop-filter:blur(12px);
      transition:0.45s;
    }

    .beat-card:hover{
      transform:translateY(-8px);
      box-shadow:0 0 35px rgba(255,255,255,0.12);
    }

    .beat-title{
      font-size:1.7rem;
      margin-bottom:20px;
      text-shadow:0 0 15px rgba(255,255,255,0.7);
    }

    audio{
      width:100%;
      margin-bottom:20px;
      filter:brightness(1.1);
    }

    .buy-btn{
      padding:14px 28px;
      border-radius:35px;
      border:1px solid rgba(255,255,255,0.7);
      background:rgba(255,255,255,0.04);
      color:white;
      cursor:pointer;
      font-size:1rem;
      transition:0.4s;
      animation:pulse 3s infinite;
    }

    .buy-btn:hover{
      transform:scale(1.06);
      box-shadow:0 0 25px rgba(255,255,255,0.75);
    }

    @keyframes pulse{
      0%{
        box-shadow:0 0 5px rgba(255,255,255,0.2);
      }

      50%{
        box-shadow:0 0 22px rgba(255,255,255,0.5);
      }

      100%{
        box-shadow:0 0 5px rgba(255,255,255,0.2);
      }
    }

    @media(max-width:768px){

      .landing h1{
        font-size:2.8rem;
      }

      .header{
        font-size:2.4rem;
      }

      .beat-card{
        width:100%;
        max-width:340px;
      }

    }

  </style>
</head>

<script>
