<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beats Of S.O.M</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Playfair Display', serif;
    }

    body, html {
      height: 100%;
      color: #f5f5f5;
    }

    .landing {
      height: 100vh;
      background: url('landing.gif') no-repeat center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    /* HALO TITLE */
    .landing h1 {
      font-size: 4rem;
      letter-spacing: 3px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 25px rgba(255,255,255,0.7),
        0 0 50px rgba(255,255,255,0.5);
    }

    /* YOUR MESSAGE */
    .subtitle {
      margin-top: 15px;
      font-size: 1.1rem;
      opacity: 0.9;
      line-height: 1.6;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    /* ANIMATED BUTTON */
    .enter-btn {
      margin-top: 35px;
      padding: 15px 45px;
      font-size: 1.1rem;
      border: 1px solid rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.4);
      color: #fff;
      cursor: pointer;
      border-radius: 30px;
      transition: 0.4s;
      animation: pulse 3s infinite;
    }

    .enter-btn:hover {
      transform: scale(1.05);
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 5px white; }
      50% { box-shadow: 0 0 25px white; }
      100% { box-shadow: 0 0 5px white; }
    }

    .main {
      min-height: 100vh;
      background: url('main.gif') no-repeat center/cover;
      padding: 50px;
      display: none;
    }

    .header {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 15px;
      text-shadow:
        0 0 10px rgba(255,255,255,0.9),
        0 0 25px rgba(255,255,255,0.6);
    }

    .main-sub {
      text-align: center;
      margin-bottom: 40px;
      font-size: 1rem;
      opacity: 0.85;
    }

    .beats {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .beat-card {
      background: rgba(0,0,0,0.55);
      padding: 25px;
      border-radius: 15px;
      backdrop-filter: blur(12px);
      width: 300px;
      text-align: center;
      transition: 0.3s;
    }

    .beat-card:hover {
      transform: translateY(-5px);
    }

    .beat-title {
      font-size: 1.6rem;
      margin-bottom: 20px;
      text-shadow: 0 0 15px rgba(255,255,255,0.8);
    }

    audio {
      width: 100%;
      margin-bottom: 20px;
    }

    .buy-btn {
      padding: 12px 25px;
      border: 1px solid white;
      background: transparent;
      color: white;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.4s;
      animation: pulse 3s infinite;
    }

    .buy-btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

<div class="landing" id="landing">
  <h1>Beats Of S.O.M</h1>

  <div class="subtitle">
    Welcome to our SECRET HAVEN 🕊️✨<br>
    Grab the beats made just for you in the Stored Echoes 🌙
  </div>

  <button class="enter-btn" onclick="enterSite()">Enter</button>
</div>

<div class="main" id="main">
  <div class="header">Beats Of S.O.M</div>

  <div class="main-sub">
    Curated sounds for artists who move differently.
  </div>

  <div class="beats">

    <!-- YOUR BEATS STAY EXACTLY AS THEY ARE -->
