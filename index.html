<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Beats Of S.O.M</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Playfair Display', serif;
    }

    body, html {
      height: 100%;
      color: #f5f5f5;
    }

    /* LANDING */
    .landing {
      height: 100vh;
      background: url('landing.gif') no-repeat center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
    }

    .landing h1 {
      font-size: 4rem;
      letter-spacing: 3px;
      text-shadow: 0 0 25px rgba(255,255,255,0.8);
    }

    .subtitle {
      margin-top: 15px;
      font-size: 1.2rem;
      opacity: 0.85;
      text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .enter-btn {
      margin-top: 35px;
      padding: 15px 45px;
      font-size: 1.1rem;
      border: 1px solid rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.4);
      color: #fff;
      cursor: pointer;
      border-radius: 30px;
      transition: 0.4s;
    }

    .enter-btn:hover {
      box-shadow: 0 0 25px rgba(255,255,255,0.8);
      transform: scale(1.05);
    }

    /* MAIN */
    .main {
      min-height: 100vh;
      background: url('main.gif') no-repeat center/cover;
      padding: 50px;
      display: none;
    }

    .header {
      text-align: center;
      font-size: 3rem;
      margin-bottom: 50px;
      text-shadow: 0 0 20px rgba(255,255,255,0.8);
    }

    .beats {
      display: flex;
      justify-content: center;
      gap: 30px;
      flex-wrap: wrap;
    }

    .beat-card {
      background: rgba(0,0,0,0.5);
      padding: 25px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      width: 300px;
      text-align: center;
    }

    .beat-title {
      font-size: 1.6rem;
      margin-bottom: 20px;
      text-shadow: 0 0 15px rgba(255,255,255,0.8);
    }

    audio {
      width: 100%;
      margin-bottom: 20px;
    }

    .buy-btn {
      padding: 12px 25px;
      border: 1px solid white;
      background: transparent;
      color: white;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.4s;
    }

    .buy-btn:hover {
      box-shadow: 0 0 25px white;
      transform: scale(1.05);
    }
  </style>
</head>

<body>

<!-- LANDING -->
<div class="landing" id="landing">
  <h1>Beats Of S.O.M</h1>
  <div class="subtitle">Ethereal Soundscapes for The Angels on Earth</div>
  <button class="enter-btn" onclick="enterSite()">Enter</button>
</div>

<!-- MAIN -->
<div class="main" id="main">
  <div class="header">Beats Of S.O.M</div>

  <div class="beats">

    <!-- ARCHANGEL -->
    <div class="beat-card">
      <div class="beat-title">Archangel</div>
      <audio controls>
        <source src="archangel-preview.mp3" type="audio/mpeg">
      </audio>
      <a href="archangel-buy.html">
        <button class="buy-btn">Unlock Beat – $10</button>
      </a>
    </div>

    <!-- AR-15 -->
    <div class="beat-card">
      <div class="beat-title">AR-15</div>
      <audio controls>
        <source src="ar15-preview.mp3" type="audio/mpeg">
      </audio>
      <a href="ar15-buy.html">
        <button class="buy-btn">Unlock Beat – $10</button>
      </a>
    </div>

    <!-- CHROME -->
    <div class="beat-card">
      <div class="beat-title">Chrome</div>
      <audio controls>
        <source src="chrome-preview.mp3" type="audio/mpeg">
      </audio>
      <a href="chrome-buy.html">
        <button class="buy-btn">Unlock Beat – $10</button>
      </a>
    </div>

  </div>
</div>

<script>
function enterSite() {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}
</script>

</body>
</html>
